name: New episode activities

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build-new:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect and build new episodes
        id: build
        run: |
          set -e
          python make_activities.py --new
          # Collect newly created output folders (untracked or modified under output/)
          mapfile -t NEW_DIRS < <(git status --porcelain output/ 2>/dev/null | awk '{print $2}' | awk -F/ 'NF>=2 {print $1"/"$2}' | sort -u)
          if [ ${#NEW_DIRS[@]} -eq 0 ]; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "No new output folders."
            exit 0
          fi
          echo "has_new=true" >> "$GITHUB_OUTPUT"
          # Prefer a single slug message when one episode was added
          SLUGS=$(printf '%s\n' "${NEW_DIRS[@]}" | awk -F/ '{print $2}' | sort -u | tr '\n' ' ' | sed 's/ *$//')
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Commit new activities
        if: steps.build.outputs.has_new == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only stage output/ (and STATUS.md if the machine updated it for failures)
          git add output/
          if git diff --cached --quiet; then
            echo "Nothing to commit under output/."
            exit 0
          fi
          SLUGS="${{ steps.build.outputs.slugs }}"
          # Commit message: "New activities for <slug>" (first slug if several)
          FIRST=$(echo "$SLUGS" | awk '{print $1}')
          git commit -m "New activities for ${FIRST}"
          git push

      - name: Commit STATUS.md on check failures
        if: always()
        run: |
          set -e
          if [ -f STATUS.md ] && ! git diff --quiet STATUS.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add STATUS.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Update STATUS.md after activities run" || true
            git push || true
          fi
